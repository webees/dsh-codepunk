# ======
# CodeQL 静态安全分析 —— python（plans/*.py、工具脚本）与 actions（.github/workflows）
# ------
# 设计要点:
#   ① 语言矩阵覆盖本仓库真实代码面：Python 门禁脚本 + 仓库自带的 GitHub Actions 工作流；
#      shell 不在 CodeQL 支持语言内（其静态检查由 CI 的 shellcheck 步承担）。
#   ② 两种语言都是 build-free 语言 ⇒ build-mode: none，无需构建步骤。
#   ③ 例行扫描用 cron（每周二 UTC 04:27），叠加 push(main) 与 PR —— 三方互补。
# ======
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: 分析（${{ matrix.language }}）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: 分析并上传结果
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
