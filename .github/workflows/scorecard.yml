# ======
# OpenSSF Scorecard —— 供应链安全体检（结果发布到公开 API，供徽章与审计引用）
# ------
# 设计要点:
#   ① publish_results: true 需要 id-token: write（OIDC 签名，结果方可被验证）；
#      上传 SARIF 需要 security-events: write。二者已是本工作流的最大权限。
#   ② 触发面覆盖 Scorecard 关注的全部变更：分支保护规则变动、main 推送、
#      每周例行、以及手动派发。
#  ③ 检出须 persist-credentials: false —— 不让 GITHUB_TOKEN 留在 .git/config 里，
#      否则 Token-Permissions 一项会被扣分。
# ======
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "20 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard 分析
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: 检出仓库（不留凭据）
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 运行 Scorecard 分析
        # 本 action **没有**浮动主版本标签 `@v2`：首次运行实测 `##[error]Unable to resolve action
        # ossf/scorecard-action@v2, unable to find version v2`（其仓库只发布 v2.x.y）。故钉最新 v2 补丁版，
        # 后续升级交给 Dependabot（github-actions 生态已覆盖本仓）。
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: 归档 SARIF（原始证据）
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: 上传 SARIF 到代码扫描
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
