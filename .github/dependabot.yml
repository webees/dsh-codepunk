# ============================================================================
# Dependabot —— 依赖更新（GitHub Actions 与 pip 两条生态）
# ----------------------------------------------------------------------------
# 设计要点:
#   ① 每周一检一次，两个生态分开成组：minor/patch 合并成单个 PR（降噪），
#      major 不并入组 ⇒ 单独成 PR，便于逐个人工评估破坏性变更。
#   ② open-pull-requests-limit 限 5：避免一次涌出十几个 PR 淹没评审队列。
#   ③ 提交信息沿用仓库的约定式前缀（chore(ci) / chore(deps)）。
# ============================================================================
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
