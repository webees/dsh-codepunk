name: 缺陷报告
description: 门禁脚本、预设安装或工作流行为不符合预期时使用（安全漏洞请走私下渠道，勿在此提交）
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填全：缺字段的报告往往无法复现，只能来回追问。
        提交前请先搜一遍既有 issue，避免重复。
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 运行 `dsh --version` 得到的版本号
      placeholder: 0.1.7
    validations:
      required: true
  - type: input
    id: preset-ref
    attributes:
      label: 预设版本 / 提交
      description: 预设的版本号或提交短哈希（`git -C <预设仓> rev-parse --short HEAD`）
      placeholder: v0.1.0 或 abc1234
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      description: 出现问题的操作系统（预设的跨平台行为差异常与平台相关）
      options:
        - macOS
        - Linux
        - Windows
        - 其他（请在「实际行为」里说明）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净环境开始按顺序列出命令；能一次跑通的复现片段最好
      placeholder: |
        1. 在空目录执行 …
        2. 再执行 …
        3. 观察到 …
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为应该发生什么（若是文档承诺的行为，请附出处）
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么，含完整错误输出与退出码（0=通过 · 1=失败 · 2=无法核验）
      render: shell
    validations:
      required: true
  - type: textarea
    id: gate-output
    attributes:
      label: 相关门禁输出
      description: 相关门禁脚本的完整输出（如 preset-score.sh / doc-consistency.sh / checker-self-test.sh）
      render: shell
    validations:
      required: false
  - type: textarea
    id: audit-output
    attributes:
      label: plans/preset-audit.sh 输出
      description: 100 分制审计的完整输出（含末行结论「总分 100/100」或「失分项 N 处」）
      placeholder: |
        $ bash plans/preset-audit.sh
        ===== dsh-codepunk 预设审计 =====
        …
        总分 100/100 —— 全项达标
      render: shell
    validations:
      required: true
