name: 功能建议
description: 对预设的能力、门禁判据或文档提出改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提出建议前请先搜一遍既有 issue 与 Discussions，避免重复。
        本预设的判据讲究「可机械核验」：描述期望时请尽量给出**可验证的判据**（哪条命令、什么输出、什么退出码）。
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 现在遇到的困难是什么，为什么现有能力解决不了
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望的改动；若能量化成判据（命令 + 期望输出/退出码）最好
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的其他方案
      description: 试过哪些绕行办法、为什么不可接受（含它们的具体问题）
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 门禁脚本（plans/）
        - 技能文档（skills/）
        - 安装与升级流程
        - CI / 发布流程（.github/）
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: 你是否愿意提交 PR
      options:
        - label: 我可以按本仓的核对清单提交 PR（本地跑通门禁并附原始输出）
          required: false
        - label: 我只能提供需求与复现，实现需维护者完成
          required: false
