name: dsh-codepunk
description: 多智能体开发流程预设（dsh-codepunk）：六阶段闭环（需求确认 → 规划与组队 → 多小组并行开发（三人小组 = 小队主责+开发+测试，独立封闭工作房）→ 巡检与交接（代码审查门）→ 解散与评分 → 串行合并 → 再规划）。主会话担任工程主责+技术统筹+会话调度（不联网、不写业务码），派遣产品策划/行业分析/人才主责/文档小组/流程审计/软件架构/代码审查/发布执行等岗位子代理；双门闩、赞助通道、goal 终裁均机械收归工程主责；goal 自动续行让子代理回报自动递送主管、无人值守地实时规划；评分与知识库跨组沉淀、持续进化。