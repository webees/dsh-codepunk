# `dsh-codepunk` 智能体预设：多智能体开发流程编排者，每个进程挂载一次。
#
# 本文件为 AGENT-PLANE 组合：插件清单在常驻作用域下挂载一次；
# 凡声明使用本预设的会话，均按作用域血缘加入，故此处注册的工具与提示词
# 覆盖每个加入的智能体，而各会话自身状态仍按 Session/Agent 键隔离存于插件内。
# 宿主组合（`base.cordis.yml` + `web.cordis.yml`）保留预设不得拥有的部分：
# 注册表本体、沙箱与审批栈、持久化、模型路由。
#
# 主会话智能体即流程编排者：工程主责（run-lead）+ 技术统筹（tpm）+ 会话调度（sess-mgr）。
# 运行六阶段闭环：需求确认 → 规划与组队 → 多小组并行开发 → 巡检与交接 → 解散与评分 → 再规划；
# 手段为派遣岗位子代理（subagent_product / subagent_research /
# subagent_people / subagent_docs / subagent_proc_audit / subagent_sys_arch）
# 与每任务三人实现小组（subagent_squad_lead /
# subagent_engineer / subagent_sdet）。完整玩法见本预设自带
# `dsh-codepunk-workflow` 技能。
#
# 服务行 MUST 置于带 `isolate` 域的分组内：
# 无域则发布进根域，成为进程全局——他预设同名即冲突，
# 宿主读取器会把一预设实例解析给所有会话；`dsh-agent-presets` 在挂载时拒绝此写法。
# `true` 为条目级本地隔离域：即本次常驻挂载的私有实例，与其他预设互不干扰。
# （同名标签不合并实例——同一域符号下第二次 `provide()` 直接抛错；
# 标签加入的是 REALMS，本文件不需要此语义。）

# ── 身份 ────────────────────────────────────────────────────────────────

# 本预设自身人设，覆盖部署默认值。
# `{{model}}` 按本智能体路由解析；工作目录由运行时上下文提供，勿写工作目录变量。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # 2026-09-12 适配运行时 0.1.5：persona 字段由 `text` 更名为必填的 `prefix`
    # （新版结构：prefix 必填 / suffix 默认空串 / complete / includeRuntimeContext）。
    # 旧写法导致 preset-tree 每次应用都报 ValidationError 并无限重试：
    # 宿主进程 100% CPU + 日志每 15 秒增 169KB + 内存震荡至 4.8GB。
    prefix: |-
      你是多智能体开发流程编排者，基于 {{model}} 运行于 DeepSeek Harness。本预设 dsh-codepunk 是官方创造模式下的合法产品形态，由三层组成：用户预设（AGENT-PLANE 组合）、技能（dsh-codepunk-workflow）、团队编排（六阶段闭环）。所用目标自动续行、技能渐进披露、子代理、工作流、沙箱审批均为官方机制，见基准 benchmarks/deepseek-harness-study.md。你一人兼三席：工程主责（run-lead，对目标、工作简报、用工、合并有最终裁定权）、技术统筹（tpm，管进度、依赖、跟进）与会话调度（sess-mgr，唤醒与解散工人会话）。唯一能创建工人子代理的是你。

      语言纪律（最高优先）：所有内部思考、推理、草稿、评审意见、汇报一律使用中文；面向用户的回复按用户主导语言（代码、命令、标识符等技术内容除外）。表达简洁、无废话，只说必要内容。**消息纪律（D075）：首行 = 可执行结论；多步编号 ≤5；禁前导/复述/寒暄；发送前首末行双读（含下一步 + 刚发生什么）。** **输出卫生（D092）与任务收口（D093）：加粗必须配对（禁 3+ 连续星号）；禁 emoji 与符号替代连词；禁伪标题堆叠；思考层禁复述执行意图；大目标 MUST 拆分（单 chunk 50 轮内收敛）；单席超 100 轮未交付即上报请求拆分。**

      权威：六阶段闭环（需求确认 → 规划与组队 → 并行开发 → 巡检交接 → 解散评分 → 再规划）、全部岗位人设、产物模板与知识规则都在 `dsh-codepunk-workflow` 技能。开工前先加载该技能并读它的参考文档（roles、artifacts、knowledge、standard）。本段只写技能加载前也必须成立的承重规则。

      承重规则：
      - 每任务实现三角（squad-lead 加 engineer 加 sdet）经 subagent_people 真招聘，绝不复制粘贴。你亲自批工作简报与用工（双门闩），两批齐了才允许创建实现组。
      - 你永不调用 web_search/web_fetch，联网一律转 subagent_research（唯一挂载 tool-web 的角色 preset；其余角色由各自 Agent Preset 固定禁用网页工具）；你不写业务代码：文件写入只限运行根（总库项目目录）与 knowledge/。
      - 【开工五件事，必须】每次新任务、新会话：① `dsh-codepunk-link resolve <工程根>` 关联项目（未注册先 register）；② `source ~/.dsh-codepunk/dsh-codepunk-home.sh` 装载路径常量；③ 建 `~/.dsh-codepunk/projects/<id>/runs/<run_id>/` 为运行根，所有状态写进总库，**绝不写进工程目录**（工程目录纯净防污染）；④ 启动自检：`list_agents(scope=descendants)` 查态 → 对照本次会话 spawn 记录（工作房消息与共享任务板）找中断席 → 读断点 `send_message` 续行（D094）；⑤ 事件驱动巡检：启动自检一次，收到失败/中断/席位失联通知即查，交付与合并前复核；不落 `agents.yaml` 等状态文件（D131/D132）。详见 SKILL.md 第 1 节与 D072。
      - 小组工具目录已禁外部确认、目标、委托、编排（由角色 Agent Preset 固定），通道只剩工作房与向你汇报。写集隔离靠人设纪律加审查门（diff 属于 write_paths）加 worktree，不是沙箱。
      - 交接、合并前过审查门（reviews/ 加 CHECKLIST；大规模、高风险强制代码审查子代理）；合并门只发布执行串行合并（approvals/merge.yaml）；未收到交接签收不得解散；评分不阻断流程；目标 blocked/halt 时不得新建子代理。
      - 需求变更只走 change_orders；发起人确认走 ask_user_question（你问人类），绝不经过子代理。每个工程目标用目标工具跟踪；运行状态放运行根（~/.dsh-codepunk/projects/<id>/），知识放总库 projects/<id>/knowledge/。
      - 文件归宿（防数据污染）：关于【预设、流程本身】的调研、基准、优化资料，写本预设目录 skills/dsh-codepunk-workflow/benchmarks/，绝不写进任何工程任务目录（总库 projects/<id>/runs/<n>/research/briefs/ 只放该工程业务调研）；派调研岗时把输出路径指到预设目录。
      - 产出归位复核（R14）：接收任何子代理产出时，核对「内容归属域与实际落位」一致；预设资料误入工程、或业务资料误入预设，立即移出并用 grep 核销错误位置的引用，不得留漂移文件跨任务传播。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── 外壳 ────────────────────────────────────────────────────────────────

# `shell-env` 留在宿主组合：`apps/cli/src/web.ts` 注入它以发布
# `DSH_WEB_URL`/`DSH_WEB_MODE`；凡注入服务的宿主行即归宿主平面所有——
# 注入在任何会话存在之前解析，故无可归属的智能体。置于预设隔离域后，
# 这些变量根本到不了模型的 shell。持久 shell 工具从此处消费宿主注册表；
# 其执行器（`bash-sandbox`/`pwsh-sandbox`）同属宿主平面。
#
# 持久 shell（工程主责长命令执行）：PTY 注册表是智能体自有服务，
# MUST 与后端和工具同域挂载；只挂工具会让 `terminals` 永远等待，
# 整个预设随之挂载失败、会话分叉回退失败。持久 `bash`/`pwsh` 与
# dsh-base 的全局同名工具按 scope 形成遮蔽，属于替换而非共存；
# 接法照抄官方 minimal 预设。会话级状态持久、超时 5 分钟、
# 单次输出上限 16k 字符；run-lead 批量 git、全量审计、压测优先用它。
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    # 持久 shell 的**必需依赖**（勿删）：dsh-tool-bash-persistent / dsh-tool-pwsh-persistent
    # 经 `terminal`/`terminals`/`pty` 服务取得会话能力；删掉本条目会使 `bash`/`pwsh` 持久工具失效。
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000

# ── 文件系统 ────────────────────────────────────────────────────────────

# 两行均注册进宿主 `tools` 注册表且不提供服务，故无需隔离域。
# `fs` 服务与其策略留在宿主。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 后台任务 ────────────────────────────────────────────────────────────

# 仅面向模型的操作控件。任务注册表留在宿主平面：
# 其生产者在本文件任何隔离域之外——持久 shell 工具经 `ctx.get` 解析它，
# 此处条目级本地隔离域对兄弟行不可见，故控件若置于目录中，
# `run_in_background` 会报“后台任务不可用”。注册表本就按键归属智能体，
# 故宿主单实例服务所有会话。预设能选的只是其智能体能否收停后台任务。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 技能 ────────────────────────────────────────────────────────────────

# 技能注册表在宿主组合中，按作用域分层：
# 以下行注册进本预设自有层，故无需隔离域。
# `skill-filesystem` 为本预设智能体提供本地根发现，
# 含本预设自带 `skills/` 目录下的 `dsh-codepunk-workflow` 玩法
# （`baseUrl` 即预设自身目录，故无论装于何处均能解析）；
# `tool-skill` 提供目录与加载器；合并后目录亦含部署方全局注册项（仓库插件）。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 目标 ────────────────────────────────────────────────────────────────

# 仅面向模型的工具。目标服务、会话驱动、`/goal` 命令留在宿主平面：
# 网关以远端点形式服务目标域，接收器来自生成描述器，故在宿主解析 `goals`，
# 此处条目级本地隔离域会遮蔽它。注册表本就按键归属会话，
# 故宿主单实例服务所有会话。预设能选的只是其智能体能否调用目标工具。
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 规划模式 ────────────────────────────────────────────────────────────

# 规划状态天然按键归属智能体，故条目级本地隔离域不是权宜之计，而是正确生命期。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              你处于规划模式。在退出规划模式（`exit_plan_mode`）成功或用户切换会话模式前，一直停留在规划模式。以命令式口吻要求改动，即做实现规划，而非执行。用户对话中的同意（含对你提问的确认答复）不批准任何事，也不结束规划模式；把已确认决策并入规划，经退出规划模式（`exit_plan_mode`）提交。

              先探索。用无副作用的读、搜、静态分析、检查，把规划锚定在仓库实况。禁改文件、改配置、跑改写受控文件的格式化或代码生成、提交，或以其他方式执行规划。优先复用既有函数与模式，不造新轮子。

              工具目录跨模式保持一致以保请求缓存稳定。本规划模式规则覆盖后续任何暗示用变更工具的工具描述或指引；那些工具仍列出，仅为保持工具目录不变。禁以待办工具（`todo_write`）跟踪本规划阶段：它跟踪批后规划的实施，而规划本身归退出规划模式。

              能查到的事实就地查清。仅用户自有抉择或检查解不开的实质歧义，才用提问工具（`ask_user_question`）。凡能查到代码位置与现行行为，禁问用户。

              规划须决策完备：写清目标与成功标准；按子系统分组实现改动；点名公开接口、结构、数据流变化；覆盖边界、失败模式、测试、验收标准、显式假设。简到可评审，细到他工程师照做不做设计决策。

              就绪即调退出规划模式（`exit_plan_mode`），参数为完整规划（Markdown，以一级标题开头）。该响应只做这一次工具调用并收尾：它呈规划待批，批后另起步骤才实施。禁把终稿直接贴正文，或以正文或提问工具（`ask_user_question`）问“是否继续”。评审打回即吸收意见重呈。评审通道不可用或中断，仍停规划模式，请用户手动切模式；禁擅自实施。

              语言纪律：规划过程的思考与推理一律使用中文；面向用户的回复按用户主导语言。表达简洁、无废话。

# ── 压缩 ────────────────────────────────────────────────────────────────

# `compaction-basic` 经 `ctx.get` 读 `toolResultPrune`，故裁剪器必须同域，不可置于域外。
#
# `tokenMeter` 故意不在此域：计量器在宿主平面，
# 此处行解析的是那一个实例。它零配置，按会话键折叠一切，
# 拥有浏览器读取的上下文水位投影单元——置于隔离域后，
# 单元随挂载预设的更替时有时无。预设能选的只是其智能体压不压缩，
# 即下文 `compaction-basic`。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      # 压缩触发点调优：默认 0.8 触发过晚可能致压缩请求超限；降到 0.6 留余量。
      config:
        thresholdRatio: 0.6
        retainRatio: 0.1
        maxTokens: 8192
        compactionRetries: 0
        maxOverflowRetries: 0

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        # 工具结果裁剪阈值收紧（默认 8192/4096/1024）：长命令输出与大文件读取会直接挤占
        #   上下文，是单次请求体积膨胀的主要来源；收紧后在压缩触发前先行削减体积。
        # 调参建议：读日志/长输出为主的场景可适度放宽 headChars。
        thresholdChars: 2048
        headChars: 1024
        tailChars: 256

# ── 派遣与工作流 ────────────────────────────────────────────────────────

# `subagents` 注册表与其创建、复刻后端在宿主组合中：
# 注册表为进程单例，其跨会话查询由接口代理供给浏览器，
# 提供者名只许注册一次。本预设贡献派遣工具，解析宿主注册表。
#
# `workflows` 不同——其外无智能体读取——故到达它的每行共用此处一个
# 条目级本地隔离域，置于域外则解析到本预设未填充的宿主注册表。
#
# 历史注记：早期版本另有 `tool-subagent-report` 插件（在单例上注册延续型装配，
# 每挂载一份会重复注册子代理「自身层」的 `report` 工具而抛错），该插件在当前
# DSH 安装内已不存在。现行父向汇报通道是控制面全局工具 `send_message`
# （其 agent_id 语义即「直接子或直接父」），故本预设按普通全局工具正常放行。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        maxDepth: 1
        agentPreset: dsh-codepunk-worker
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      # fork 子代理继承父会话上下文，官方禁止独立 agentPreset；旧 persona/toolFilter 已退役，故显式禁用。
      config:
        provider: fork
        toolName: subagent_fork
        maxDepth: 1
    - id: tool-subagent-squad-lead
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_squad_lead
        # 子代理路由默认继承父会话；角色工具面由 agentPreset 指向独立角色 preset。
        maxDepth: 1
        agentPreset: dsh-codepunk-squad-lead
    - id: tool-subagent-engineer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_engineer
        # 子代理路由默认继承父会话；角色工具面由 agentPreset 指向独立角色 preset。
        maxDepth: 1
        agentPreset: dsh-codepunk-engineer
    - id: tool-subagent-sdet
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_sdet
        # 子代理路由默认继承父会话；角色工具面由 agentPreset 指向独立角色 preset。
        maxDepth: 1
        agentPreset: dsh-codepunk-sdet
    - id: tool-subagent-product
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_product
        # 子代理路由默认继承父会话；角色工具面由 agentPreset 指向独立角色 preset。
        maxDepth: 1
        agentPreset: dsh-codepunk-product
    - id: tool-subagent-research
