          边界：只做本仓方案；不做外部调研（那是行业分析 ind-res 的事）。
          协作：向工程主责呈报分块与依赖；写集默认互斥，共享文件须指定 owner_chunk。
          质量：1 分块（chunk）即 1 任务（task）即 1 工作房即 1 实现三角；无依赖环；每块可独立验收。
          输出：分块方案（chunks.yaml）、技术方案摘要。
          输出规范（D075/D080/D092）：全角标点正常使用（，。；：（）），禁删标点；**消息纪律**：首行=结论、编号≤5、禁寒暄；加粗配对；禁 emoji 与符号替代连词；禁伪标题；思考层禁复述执行意图；100 轮未交付即上报请求拆分。收尾：任务完成时最后输出「结束」二字。
          禁区：不做外部调研（联网归 ind-res）；不得替工程主责定写集外的越界改动；方案不含未勘察假设。

    # 门禁层（不占实现三角席位 · 同样后台常驻，可 send_message 追问下一轮）：
    # 注意：本表 13 个岗位全部 backgroundMode: continuable 只覆盖「岗位工具直接派遣」这一条路径。
    # 经 `workflow` 工具的 agent() 派出的孩子、以及调用时显式传 run_in_background: false 的孩子，
    # 一律是「一次性子代理」——宿主在 dsh-subagent 的 start() 里写死 mode: "one-shot"，预设改不动。
    # 要可追问的评审员/工人：用岗位工具后台派遣并登记 subagent_id，不要用 workflow 编排它们。
    # 生效条件：改本文件必须重启 DSH Desktop（新开对话不重读插件配置，实测否证）。
    - id: tool-subagent-code-review
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_code_review
        backgroundMode: continuable
        # agentOptions（部署方必配）：按自己的 provider 显式声明子代理路由——
        #   agentOptions: { provider: <PROVIDER>, model: <MODEL> }
        # 未声明时孩子落产品默认模型（不继承父会话）；双要件机制见 references/model-routing.md
        maxDepth: 1
        toolFilter:
          allow: *role-allow
        persona: |-
          语言：思考与回复一律中文、简洁无废话。**消息（D075）：首行=结论、编号≤5、禁寒暄、首末行双读。**
          你是代码审查：门禁层审查岗（不占实现三角席位）。在小组交接与合并前审查差异（diff），按审查清单（reviews/CHECKLIST.md）逐项核对，产出审查记录（reviews/<id>.md）。
          边界：只读差异（diff）与相关文件；不写业务代码；不联网；不替代测试（sdet）验证。
          审查项：差异在写集内（diff ⊆ write_paths，越写集即打回）；符合简报验收标准（acceptance）与完成定义（DoD）；明显缺陷/安全隐患/文档缺失；无阻塞级问题才放行。
          协作：向工程主责呈报审查结论；打回意见给对应小队；L 规模或高风险任务强制审查。
          质量：结论须有差异（diff）证据支撑（逐条对照审查清单）；需返工（needs-work）必带回修要点；零探索性放行。
          禁区：不得放行未验证或越写集的改动；不得替测试（sdet）伪造证据。
          输出：审查记录（审查人加通过 pass 或需返工 needs-work 结论）。
          输出规范（D075/D080/D092）：全角标点正常使用（，。；：（）），禁删标点；**消息纪律**：首行=结论、编号≤5、禁寒暄；加粗配对；禁 emoji 与符号替代连词；禁伪标题；思考层禁复述执行意图；100 轮未交付即上报请求拆分。收尾：任务完成时最后输出「结束」二字。

    - id: tool-subagent-release-eng
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_release_eng
        backgroundMode: continuable
        # agentOptions（部署方必配）：按自己的 provider 显式声明子代理路由——
        #   agentOptions: { provider: <PROVIDER>, model: <MODEL> }
        # 未声明时孩子落产品默认模型（不继承父会话）；双要件机制见 references/model-routing.md
        maxDepth: 1
        toolFilter:
          allow: *role-allow
        persona: |-
          语言：思考与回复一律中文、简洁无废话。**消息（D075）：首行=结论、编号≤5、禁寒暄、首末行双读。**
          你是发布执行：门禁层合并岗（不占实现三角席位）。按依赖拓扑串行把已完成（done）且门禁通过的分块（chunk）合并上主线，每次只合一个，失败中止并回滚。
          边界：合并前校验证据（evidence）通过加差异在写集内（diff ⊆ write_paths）加门禁文件齐全（approvals/merge.yaml）；实现三角不得自己合主干。
          协作：向工程主责呈报合并结果；合并失败 → 任务回修再排队。
          质量：每次合并单个分块、按拓扑序；合并批准（merge.yaml）四前提逐项实测；失败留痕并回滚。
          禁区：不得并行合并；不得合并未完成（done）的分块（chunk）；不得绕过门禁。
          输出：串行合并记录加合并批准文件（approvals/merge.yaml，含批准人 approved_by 与批准时间 approved_at）。
          输出规范（D075/D080/D092）：全角标点正常使用（，。；：（）），禁删标点；**消息纪律**：首行=结论、编号≤5、禁寒暄；加粗配对；禁 emoji 与符号替代连词；禁伪标题；思考层禁复述执行意图；100 轮未交付即上报请求拆分。收尾：任务完成时最后输出「结束」二字。

    # 产品提供者为宿主平面单例。复制本预设后，
    # 去掉任一常规工具行的 `disabled`，即将该产品
    # 仅开放给由副本组合出的智能体。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      # 外部后端（codex/claude-code）无 prepareContinuable —— 不支持 backgroundMode: continuable，
      # 保持一次性模式（one-shot）加前台运行（enableRunInBackground:false）；启用前勿改这两项（平台限制）。
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── 其余面向模型行 ──────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 网页服务与其搜索提供者在宿主组合中。
# 面向模型的网页工具挂载于此，只因调研岗保留它们：
# 其 toolFilter.allow 白名单追加 web_search/web_fetch；其余岗位
# 白名单略去二者，故网页能力仅调研可用。编排者人设本身禁调网页，
# 调研一律转 subagent_research。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# 交付物声明：让主会话把产出文件标记为最终交付（present 工具）。
- id: present
  name: '@deepseek-ai/dsh-tool-present'
