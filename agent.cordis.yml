# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition.
# The model-facing web tools ARE mounted here because only 调研岗 keeps them:
# its toolFilter.allow whitelist adds web_search/web_fetch; every other role's
# allow whitelist omits them, so web stays research-only. The orchestrator
# persona itself forbids calling web — 调研一律转 subagent_research.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
